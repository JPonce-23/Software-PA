# Configuración sin bind mounts ni hot reload.
# Uso con SSALFER: selección explícita de base + prod + ssalfer.
# Ver frontend-ssalfer/DEPLOY.md; operación real y TLS requieren autorización aparte.
services:
  backend:
    environment:
      APP_ENV: production
      AUTH_COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?Define el origen HTTPS público exacto}
