# Canonical PR6 policy on successes AND failures; retain CSP Report-Only.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cache-Control "private, no-store" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-eBwjXLe8ZkutH1BQuUUTD6eqlesYB5uKLZlAZ9qiI9w=' 'sha256-exbl8sIP9/kdAr5KMdNqeKwp3sX6bjMBhQ5q0fh9VsI=' 'sha256-tLiZ7d9F54Z+tEtcOZUIcIq3zYmr2jThOVnAwVbXNVM=' 'sha256-yXesgTDaeX1tsllDjO1S7i5LHde5KaHFfkTN5YyKbZk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
