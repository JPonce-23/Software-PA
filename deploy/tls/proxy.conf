proxy_http_version 1.1;
# Keep the upstream alive while it rejects a body early (401/403).
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Edge is the first trusted hop. Never accept client-supplied forwarding data.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# Uvicorn intentionally ignores forwarding headers. Canonical slash redirects
# from its internal HTTP URL must remain HTTPS at the browser boundary.
proxy_redirect http://$host/ https://$host/;
proxy_hide_header Cache-Control;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_cache off;
proxy_store off;
proxy_intercept_errors off;
proxy_read_timeout 300s;
