# Overlay del frontend oficial SSALFER estático en Nginx.
# Está en la raíz, junto a docker-compose.yml y frontend-ssalfer/.
# El Compose base define db, pgadmin y backend; este overlay añade frontend_ssalfer.
# Seleccionar explícitamente base + ssalfer; para desarrollo, base + override + ssalfer.
# No combinar override (desarrollo) con prod.
# Procedimiento de instalación/QA aislada y reconstrucción dirigida:
# frontend-ssalfer/DEPLOY.md. No ejecutar un arranque general en un servidor existente.

services:
  frontend_ssalfer:
    build:
      context: ./frontend-ssalfer
      dockerfile: deploy/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:${SSALFER_HOST_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
