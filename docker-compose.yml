x-backend-environment: &backend-environment
  DB_RUNTIME_USER: ${DB_RUNTIME_USER:?Define DB_RUNTIME_USER en el archivo .env}
  DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Define DB_RUNTIME_PASSWORD en el archivo .env}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-db_pruebas_alfredo}
  SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_ENV: ${APP_ENV:-development}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  AUTH_INACTIVITY_MINUTES: ${AUTH_INACTIVITY_MINUTES:-30}
  AUTH_ABSOLUTE_MINUTES: ${AUTH_ABSOLUTE_MINUTES:-480}
  AUTH_LOCK_MINUTES: ${AUTH_LOCK_MINUTES:-15}
  AUTH_TRUSTED_PROXY_IPS: ${AUTH_TRUSTED_PROXY_IPS:-}
  REPORT_MAX_ROWS: ${REPORT_MAX_ROWS:-10000}
  REPORT_EXPORT_MAX_BYTES: ${REPORT_EXPORT_MAX_BYTES:-16777216}
  REPORT_FETCH_BATCH_ROWS: ${REPORT_FETCH_BATCH_ROWS:-250}
  REPORT_EXPORT_BUILD_TIMEOUT_SECONDS: ${REPORT_EXPORT_BUILD_TIMEOUT_SECONDS:-}
  DOCUMENT_INSPECTION_ENTRIES: ${DOCUMENT_INSPECTION_ENTRIES:-2048}
  DOCUMENT_INSPECTION_DIRECTORY_BYTES: ${DOCUMENT_INSPECTION_DIRECTORY_BYTES:-4194304}
  DOCUMENT_INSPECTION_EXPANDED_BYTES: ${DOCUMENT_INSPECTION_EXPANDED_BYTES:-104857600}
  DOCUMENT_INSPECTION_MEMBER_BYTES: ${DOCUMENT_INSPECTION_MEMBER_BYTES:-33554432}
  DOCUMENT_INSPECTION_XML_BYTES: ${DOCUMENT_INSPECTION_XML_BYTES:-8388608}
  DOCUMENT_INSPECTION_XML_NODES: ${DOCUMENT_INSPECTION_XML_NODES:-100000}
  DOCUMENT_INSPECTION_XML_DEPTH: ${DOCUMENT_INSPECTION_XML_DEPTH:-64}
  DOCUMENT_INSPECTION_IMAGE_RECORDS: ${DOCUMENT_INSPECTION_IMAGE_RECORDS:-4096}
  IMPORT_MAX_FILE_SIZE_MB: ${IMPORT_MAX_FILE_SIZE_MB:-100}
  IMPORT_GEOJSON_MAX_FEATURE_MB: ${IMPORT_GEOJSON_MAX_FEATURE_MB:-16}
  IMPORT_MAX_RECORD_BYTES: ${IMPORT_MAX_RECORD_BYTES:-67108864}
  IMPORT_MAX_OUTPUT_BYTES: ${IMPORT_MAX_OUTPUT_BYTES:-536870912}
  IMPORT_MAX_INSPECTION_BYTES: ${IMPORT_MAX_INSPECTION_BYTES:-8388608}
  IMPORT_MAX_LAYERS: ${IMPORT_MAX_LAYERS:-16}
  IMPORT_MAX_FEATURES: ${IMPORT_MAX_FEATURES:-100000}
  IMPORT_ZIP_MAX_ENTRIES: ${IMPORT_ZIP_MAX_ENTRIES:-2048}
  IMPORT_ZIP_MAX_MEMBER_BYTES: ${IMPORT_ZIP_MAX_MEMBER_BYTES:-268435456}
  IMPORT_MAX_UNCOMPRESSED_MB: ${IMPORT_MAX_UNCOMPRESSED_MB:-500}
  IMPORT_STAGING_BATCH_SIZE: ${IMPORT_STAGING_BATCH_SIZE:-250}
  IMPORT_CONFIRM_BATCH_SIZE: ${IMPORT_CONFIRM_BATCH_SIZE:-100}
  IMPORT_GDAL_TIMEOUT_SECONDS: ${IMPORT_GDAL_TIMEOUT_SECONDS:-300}
  IMPORT_STAGING_RETENTION_DAYS: ${IMPORT_STAGING_RETENTION_DAYS:-30}
  IMPORT_MAKE_VALID_MAX_AREA_DELTA: ${IMPORT_MAKE_VALID_MAX_AREA_DELTA:-}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Define POSTGRES_ADMIN_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD en el archivo .env}
      POSTGRES_DB: ${DB_NAME:-db_pruebas_alfredo}
      DB_RUNTIME_USER: ${DB_RUNTIME_USER:?Define DB_RUNTIME_USER en el archivo .env}
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Define DB_RUNTIME_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init/001_bootstrap_roles.sh:/docker-entrypoint-initdb.d/001_bootstrap_roles.sh:ro
      - ./backend/db/init/002_apply_migrations.sh:/docker-entrypoint-initdb.d/002_apply_migrations.sh:ro
      - ./backend/db/migrations:/opt/software-pa/migrations:ro
      - ./backend/scripts/run_migrations.sh:/opt/software-pa/scripts/run_migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Define PGADMIN_DEFAULT_EMAIL en el archivo .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Define PGADMIN_DEFAULT_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost/misc/ping', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  backend:
    image: software-pa-backend
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers", "--log-config", "/app/logging.json", "--no-access-log"]
    restart: always
    environment:
      <<: *backend-environment
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/app/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      TEST_ADMIN_EMAIL: ${TEST_ADMIN_EMAIL:-}
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

volumes:
  postgres_data:
  pgadmin_data:
  uploads_data:
