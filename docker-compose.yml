x-backend-environment: &backend-environment
  DB_USER: ${DB_USER:?Define DB_USER en el archivo .env}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-db_trenes}
  SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  APP_ENV: ${APP_ENV:-development}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  AUTH_INACTIVITY_MINUTES: ${AUTH_INACTIVITY_MINUTES:-30}
  AUTH_ABSOLUTE_MINUTES: ${AUTH_ABSOLUTE_MINUTES:-480}
  AUTH_LOCK_MINUTES: ${AUTH_LOCK_MINUTES:-15}
  AUTH_TRUSTED_PROXY_IPS: ${AUTH_TRUSTED_PROXY_IPS:-}
  IMPORT_MAX_FILE_SIZE_MB: ${IMPORT_MAX_FILE_SIZE_MB:-100}
  IMPORT_STAGING_BATCH_SIZE: ${IMPORT_STAGING_BATCH_SIZE:-250}
  IMPORT_CONFIRM_BATCH_SIZE: ${IMPORT_CONFIRM_BATCH_SIZE:-100}
  IMPORT_GDAL_TIMEOUT_SECONDS: ${IMPORT_GDAL_TIMEOUT_SECONDS:-300}
  IMPORT_STAGING_RETENTION_DAYS: ${IMPORT_STAGING_RETENTION_DAYS:-30}
  IMPORT_MAKE_VALID_MAX_AREA_DELTA: ${IMPORT_MAKE_VALID_MAX_AREA_DELTA:-}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?Define DB_USER en el archivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      POSTGRES_DB: ${DB_NAME:-db_trenes}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Define PGADMIN_DEFAULT_EMAIL en el archivo .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Define PGADMIN_DEFAULT_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost/misc/ping', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  backend:
    image: software-pa-backend
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: always
    environment:
      <<: *backend-environment
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/app/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      TEST_ADMIN_EMAIL: ${TEST_ADMIN_EMAIL:-}
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  alertas_scheduler:
    image: software-pa-backend
    build:
      context: ./backend
    command: ["python", "-m", "app.jobs.alertas_scheduler"]
    restart: always
    environment:
      <<: *backend-environment
      ALERTAS_INTERVAL_SECONDS: ${ALERTAS_INTERVAL_SECONDS:-86400}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/app/uploads}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres_data:
  pgadmin_data:
  uploads_data:
