# Included by nginx.conf inside http {}. Keep request/user data out of access logs.
# Error logs still require protected collection/review; they cannot use log_format.
log_format ssalfer_safe escape=json
    '{"component":"ssalfer_proxy","request_id":"$request_id",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log ssalfer_safe;

    # Keep these at server scope: a child add_header would replace inheritance
    # on nginx 1.27. "always" also covers proxy/application error responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "private, no-store" always;
    # Candidate only: inline scripts and library behavior need browser QA.
    # No external report collector and no premature CSP enforcement/TLS policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    root /usr/share/nginx/html;
    index Index.html;

    # Defense in depth; the SS-08 image already copies runtime assets selectively.
    location ~* \.(md|cjs|map)$ { return 404; }
    location ~ (^|/)[.] { return 404; }
    location ~* ^/(deploy|outputs|docs|tests)(/|$) { return 404; }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Todo lo que empiece con /api/ se reenvía al contenedor del backend,
    # que en la red interna de docker-compose se llama "backend" y
    # escucha en el puerto 8000 (ver docker-compose.yml del backend).
    #
    # Esto hace que, desde el punto de vista del navegador, frontend y
    # backend vivan en el MISMO origen (mismo dominio/puerto), que es
    # justo lo que requieren las cookies __Host-pa_session / __Host-pa_csrf
    # en producción.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Canonical browser headers above preserve SS-06 downloads without
        # duplicate upstream Cache-Control/nosniff values. Attachment/MIME and
        # Set-Cookie pass through unchanged; errors retain their upstream status.
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_cache off;
        proxy_store off;
        proxy_intercept_errors off;
    }

    # Archivos estáticos del frontend SSALFER.
    location / {
        try_files $uri $uri/ =404;
    }
}
