server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index Index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Todo lo que empiece con /api/ se reenvía al contenedor del backend,
    # que en la red interna de docker-compose se llama "backend" y
    # escucha en el puerto 8000 (ver docker-compose.yml del backend).
    #
    # Esto hace que, desde el punto de vista del navegador, frontend y
    # backend vivan en el MISMO origen (mismo dominio/puerto), que es
    # justo lo que requieren las cookies __Host-pa_session / __Host-pa_csrf
    # en producción.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estáticos del frontend SSALFER.
    location / {
        try_files $uri $uri/ =404;
    }
}
