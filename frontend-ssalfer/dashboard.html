<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard | SSALFER</title>

    <link
        rel="stylesheet"
        href="/styles/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="40x40"
        href="/img/LOGOS VERDE/IMAGOTIPO.png"
    >

</head>


<body>


    <!-- =====================================================
                            ASIDE
    ====================================================== -->

    <aside class="aside">

        <button
            class="btn-menu"
            type="button"
            aria-label="Contraer menú"
        >

            <i class="bi bi-list"></i>

        </button>


        <div class="logo-aside">

            <img
                src="/img/LOGOS VERDE/IMAGOTIPO.png"
                alt="Logo SSALFER"
            >

        </div>


        <div class="bienvenida">

            <h3>
                Bienvenido
            </h3>

            <span class="js-usuario-nombre">
                Usuario
            </span>

        </div>


        <nav class="barra">


            <!-- TODOS LOS PROYECTOS -->

            <a
                href="#"
                class="activo"
            >

                <i class="bi bi-train-front"></i>

                <span>
                    Todos los proyectos
                </span>

            </a>


            <!-- PROYECTOS -->

            <div class="proyectos">

                <h4>
                    Proyectos
                </h4>


                <div class="proyectos-lista-dinamica" id="proyectosLista"></div>


                <!-- NUEVO PROYECTO -->

                <a href="/pages/nuevoProyecto.html">

                    <i class="bi bi-plus-circle"></i>

                    <span>
                        Nuevo proyecto
                    </span>

                </a>

            </div>




            <div class="proyectos js-admin-only" hidden>

                <h4>
                    Administración
                </h4>

                <a href="/pages/usuarios.html">
                    <i class="bi bi-people"></i>
                    <span>Usuarios</span>
                </a>

                <a href="/pages/catalogosOperativos.html">
                    <i class="bi bi-list-check"></i>
                    <span>Catálogos operativos</span>
                </a>

                <a href="/pages/auditoria.html">
                    <i class="bi bi-journal-text"></i>
                    <span>Auditoría</span>
                </a>

            </div>




            <!-- MAPA -->

        <!--    <a href="#">

                <i class="bi bi-map"></i>

                <span>
                    Ver mapa
                </span>

            </a> -->


            <!-- USUARIO -->

            <div class="usuario-panel">

                <button
                    class="usuario-btn"
                    type="button"
                >

                    <i class="bi bi-person-circle"></i>

                    <span class="js-usuario-nombre">
                        Carlos Pérez
                    </span>

                    <i class="bi bi-chevron-up"></i>

                </button>


                <div class="opciones-usuario">


                    <a href="/pages/usuarios.html">

                        <i class="bi bi-people"></i>

                        Usuarios y permisos

                    </a>


                    <a href="#" data-action="logout">

                        <i class="bi bi-box-arrow-left"></i>

                        Cerrar sesión

                    </a>

                </div>

            </div>

        </nav>

    </aside>



    <!-- =====================================================
                            HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo-ssalfer">

            <img
                src="/img/LOGOS VERDE/SSALFER.png"
                alt="SSALFER"
            >

            <img
                src="/img/LOGOS VERDE/NOMBRE_LOGO.png"
                alt="Nombre SSALFER"
            >

        </div>


        <a
            class="logo-pa"
            href="https://www.gob.mx/pa"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Procuraduría Agraria"
        >

            <img
                src="/img/PA_LOGO_FIN.png"
                alt="Procuraduría Agraria"
            >

        </a>

    </header>



    <!-- =====================================================
                    CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="contenedor">


        <div id="dashboardMensajeError" class="mensaje-error" hidden></div>


        <div class="dashboard-acciones">

            <a
                id="btnExportarDashboardCsv"
                class="btn-secundario"
                href="#"
            >
                <i class="bi bi-download"></i>
                Exportar dashboard (CSV)
            </a>

        </div>


        <div id="listaProyectosDashboard" class="lista-proyectos-dashboard">

            <p class="proyectos-lista-vacia">
                Cargando proyectos…
            </p>

        </div>


    </main>



    <!-- =====================================================
                            FOOTER
    ====================================================== -->

    <footer class="footer">

        <p>
            &copy; 2026 Procuraduría Agraria.
            Todos los derechos reservados.
        </p>

    </footer>



    <script src="/js/env.js"></script>
<script src="/js/config.js"></script>
<script src="/js/api/cliente.js"></script>
<script src="/js/api/auth.js"></script>
<script src="/js/api/catalogos.js"></script>
<script src="/js/api/proyectos.js"></script>
<script src="/js/api/nucleos.js"></script>
<script src="/js/api/personas.js"></script>
<script src="/js/api/orv.js"></script>
<script src="/js/api/padrones.js"></script>
<script src="/js/api/actividades.js"></script>
<script src="/js/api/parcelas.js"></script>
<script src="/js/api/unidadesAgrarias.js"></script>
<script src="/js/api/afectaciones.js"></script>
<script src="/js/api/seguimiento.js"></script>
<script src="/js/api/asambleas.js"></script>
<script src="/js/api/tramitesRan.js"></script>
<script src="/js/api/convenios.js"></script>
<script src="/js/api/fifonafe.js"></script>
<script src="/js/api/documentos.js"></script>
<script src="/js/api/indemnizacion.js"></script>
<script src="/js/api/reportes.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    window.AuthAPI.requerirSesion();
});
</script>

<script src="/js/dashboard.js"></script>

</body>

</html>
