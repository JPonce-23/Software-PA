# Configuración de desarrollo. Docker Compose la combina automáticamente
# con docker-compose.yml cuando se ejecuta `docker compose ...`.
services:
  backend:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
